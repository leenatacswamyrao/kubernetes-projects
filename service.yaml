apiVersion: v1
kind: Service
metadata:
  name: my-web-service
spec:
  selector:
    app: my-web-app    # This MUST match the label in your Deployment
  ports:
    - protocol: TCP
      port: 80         # Port the service listens on
      targetPort: 80   # Port the Pod is listening on
  type: NodePort       # This makes it accessible outside the cluster